<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>名片樣式</title>
        <link rel="stylesheet" href="cardstyle.css">
    </head>
    <body>
        <aside>
        <div>
            <div class="logo-area">CardHub <span>後台</span></div>
            <nav>
                <!-- 點擊可跳回首頁 -->
                <a href="userbackend.html">總覽首頁</a>
                <!-- 當前頁面高亮顯示 -->
                <a href="themepicker.html" class="active">名片樣式</a>
                <a href="#">成效分析</a>
                <a href="#">模版市場</a>
                <a href="#">帳戶設定</a>
            </nav>
        </div>
        <div class="user-profile">
            <div class="avatar-placeholder">美</div>
            <div class="user-info">
                <h4>陳小美</h4>
                <p>專業設計師</p>
            </div>
        </div>
    </aside>

    <!-- 主要內容區 -->
    <main>
        <header>
            <div>
                <h1>名片風格客製化</h1>
                <p>為您的個人品牌選配最完美的視覺主題。</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary">套用此風格</button>
            </div>
        </header>

        <!-- 工作區：左側選配版型、右側即時預覽 -->
        <section class="workspace">
            <!-- 左側客製化選單 -->
            <div class="card-panel">
                <div class="panel-title">選擇核心名片版型</div>
                <div class="style-selector">
                    <button class="style-option active" data-theme="theme-business">
                        <div class="color-preview business-color"></div>
                        <span>專業商務 (Business)</span>
                    </button>
                    <button class="style-option" data-theme="theme-creative">
                        <div class="color-preview creative-color"></div>
                        <span>潮流設計 (Creative)</span>
                    </button>
                    <button class="style-option" data-theme="theme-luxury">
                        <div class="color-preview luxury-color"></div>
                        <span>極簡奢華 (Luxury)</span>
                    </button>
                </div>

                <div class="panel-title" style="margin-top: 40px;">額外進階選配</div>
                <div class="form-group">
                    <label>動態特效 (進階)</label>
                    <input type="text" placeholder="預設：無動態背景" disabled style="background-color: #f1f5f9; cursor: not-allowed;">
                </div>
            </div>

            <!-- 右側手機端模擬器 -->
            <div class="card-panel preview-container">
                <div class="panel-title" style="width: 100%;">樣式即時預覽</div>
                
                <div class="phone-shell">
                    <div class="phone-notch"></div>
                    <!-- 預設載入專業商務風 -->
                    <div class="phone-screen theme-business" id="phone-screen">
                        <div class="inner-avatar">美</div>
                        <div class="inner-name">陳小美</div>
                        <div class="inner-title">UI/UX 設計師兼品牌顧問</div>
                        <div class="inner-bio">專注於打造直覺、美觀的一頁式數位體驗，協助個人品牌實現商業數位轉型。</div>
                        
                        <div class="phone-links">
                            <div class="phone-link-btn">加入 LINE 好友</div>
                            <div class="phone-link-btn">瀏覽作品集</div>
                            <div class="phone-link-btn">預約顧問諮詢</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 風格切換 JavaScript 邏輯 -->
    <script>
        const styleOptions = document.querySelectorAll('.style-option');
        const phoneScreen = document.getElementById('phone-screen');

        styleOptions.forEach(option => {
            option.addEventListener('click', () => {
                // 1. 切換選取按鈕的高亮狀態
                styleOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                
                // 2. 移除手機原本的風格，換上新風格
                phoneScreen.className = 'phone-screen'; 
                const newTheme = option.getAttribute('data-theme');
                phoneScreen.classList.add(newTheme);
            });
        });
    </script>
    </body>
</html>
