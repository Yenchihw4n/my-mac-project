<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子名片管理後台</title>
    <link rel="stylesheet" href="userbackend.css">
</head>
<body>
    <aside>
        <div>
            <div class="logo-area">CardHub <span>後台</span></div>
            <nav>
                <a href="userbackend.html" class="active">總覽首頁</a>
                <a href="cardstyle.html">名片樣式</a>
                <a href="#">成效分析</a>
                <a href="#">模版市場</a>
                <a href="#">帳戶設定</a>
            </nav>
        </div>
        <div class="user-profile">
            <div class="avatar-placeholder">美</div>
            <div class="user-info">
                <h4>陳小美</h4>
                <p>專業設計師</p>
            </div>
        </div>
    </aside>

    <!-- 主要內容區 (對應 main 樣式) -->
    <main>
        <!-- 頂部列 -->
        <header>
            <div>
                <h1>歡迎回來，小美！</h1>
                <p>今天又是拓展商務人脈的好時機。</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-outline">預覽名片</button>
                <button class="btn btn-primary">分享名片</button>
            </div>
        </header>

        <!-- 數據卡片區 (對應 stats-grid 樣式) -->
        <section class="stats-grid">
            <div class="stat-card">
                <div>
                    <span class="stat-label">本月瀏覽量</span>
                    <span class="stat-value">1,248</span>
                </div>
            </div>
            <div class="stat-card">
                <div>
                    <span class="stat-label">連結點擊率</span>
                    <span class="stat-value">24.5%</span>
                </div>
            </div>
            <div class="stat-card">
                <div>
                    <span class="stat-label">交換成功數</span>
                    <span class="stat-value">86</span>
                </div>
            </div>
            <div class="stat-card">
                <div>
                    <span class="stat-label">目前名片狀態</span>
                    <div><span class="status-badge">已上線</span></div>
                </div>
            </div>
        </section>

        <!-- 工作區：左編輯、右預覽 (對應 workspace 樣式) -->
        <section class="workspace">
            <!-- 左側表單 -->
            <div class="card-panel">
                <div class="panel-title">基本資訊編輯</div>
                
                <div class="avatar-edit-section">
                    <div class="big-avatar-placeholder">美</div>
                    <div>
                        <button class="btn btn-dark">上傳新頭像</button>
                        <p class="avatar-hint">支援 JPG、PNG 格式，檔案大小不超過 2MB。</p>
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label>姓名</label>
                        <input type="text" id="input-name" value="陳小美">
                    </div>
                    <div>
                        <label>職稱</label>
                        <input type="text" id="input-title" value="UI/UX 設計師兼品牌顧問">
                    </div>
                </div>

                <div class="form-group">
                    <label>個人簡介</label>
                    <textarea id="input-bio" rows="3">專注於打造直覺、美觀的一頁式數位體驗，協助個人品牌實現商業數位轉型。</textarea>
                </div>

                <div class="panel-title" style="margin-top: 32px;">社群與聯絡管道</div>
                
                <div class="form-group">
                    <label>LINE ID</label>
                    <input type="text" value="@xiaomei_design">
                </div>
                <div class="form-group">
                    <label>Instagram</label>
                    <input type="text" value="https://instagram.com">
                </div>
                <div class="form-group">
                    <label>LinkedIn</label>
                    <input type="text" value="https://linkedin.com">
                </div>

                <div style="text-align: right; margin-top: 24px;">
                    <button class="btn btn-primary" style="padding: 12px 24px;">儲存所有設定</button>
                </div>
            </div>

            <!-- 右側手機預覽 -->
            <div class="card-panel preview-container">
                <div class="panel-title" style="width: 100%;">手機端即時預覽</div>
                
                <div class="phone-shell">
                    <div class="phone-notch"></div>
                    <div class="phone-screen">
                        <div class="inner-avatar">美</div>
                        <div class="inner-name" id="preview-name">陳小美</div>
                        <div class="inner-title" id="preview-title">UI/UX 設計師兼品牌顧問</div>
                        <div class="inner-bio" id="preview-bio">專注於打造直覺、美觀的一頁式數位體驗，協助個人品牌實現商業數位轉型。</div>
                        
                        <div class="phone-links">
                            <div class="phone-link-btn">加入 LINE 好友</div>
                            <div class="phone-link-btn">瀏覽作品集</div>
                            <div class="phone-link-btn">預約顧問諮詢</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript 腳本：在輸入框打字時，右側手機預覽會跟著即時動態改變！ -->
    <script>
        const inputName = document.getElementById('input-name');
        const inputTitle = document.getElementById('input-title');
        const inputBio = document.getElementById('input-bio');

        const previewName = document.getElementById('preview-name');
        const previewTitle = document.getElementById('preview-title');
        const previewBio = document.getElementById('preview-bio');

        inputName.addEventListener('input', (e) => previewName.textContent = e.target.value);
        inputTitle.addEventListener('input', (e) => previewTitle.textContent = e.target.value);
        inputBio.addEventListener('input', (e) => previewBio.textContent = e.target.value);
    </script>

</body>
</html>
